<div style="background-color:#F3F4F6;padding:24px 16px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:600px;margin:0 auto;background-color:#ffffff;border:1px solid #e5e7eb;">
    <div style="padding:14px 16px;border-bottom:1px solid #e5e7eb;font-size:15px;color:#111827;">
      New application: {{applicationRef}}
    </div>
    <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;font-size:14px;">
      {{#each rows}}
      <tr><td style="padding:8px 16px;background-color:#eaf2fa;font-weight:bold;color:#111827;">{{label}}</td></tr>
      <tr><td style="padding:8px 16px 12px 32px;color:#374151;border-bottom:1px solid #f1f5f9;">{{#if value}}{{value}}{{else}}<span style="color:#9ca3af;">Not provided</span>{{/if}}</td></tr>
      {{/each}}
    </table>
    {{#if adminUrl}}
    <div style="padding:14px 16px;font-size:13px;color:#6b7280;">
      All applications: <a href="{{adminUrl}}" style="color:#4f46e5;">{{adminUrl}}</a>
    </div>
    {{/if}}
  </div>
</div>
